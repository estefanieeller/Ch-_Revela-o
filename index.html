<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chá Revelação - Priscila & Diego</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            text-align: center; 
            padding: 40px 20px;
            min-height: 100vh;
            margin: 0;
            
            /* --- FUNDO BRANCO ATRÁS DA FOTO --- */
            background-color: #ffffff; 
            background-image: url('foto.jpg'); /* Coloque o nome da foto dos pais aqui */
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            background-repeat: no-repeat;
        }

        .container { 
            max-width: 550px; 
            margin: auto; 
            
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(4px); 
            
            padding: 40px 30px; 
            border-radius: 20px; 
            box-shadow: 0px 10px 30px rgba(0,0,0,0.25); 
        }

        h1 { 
            font-family: 'Fredoka', sans-serif;
            color: #333; 
            font-size: 2.5em;
            margin-bottom: 5px;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.8);
        }
        h2 {
            font-family: 'Fredoka', sans-serif;
            color: #444; 
            font-size: 1.4em;
            margin-top: 0;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }
        .music-icons {
            font-size: 2em;
            margin: 15px 0;
            letter-spacing: 15px;
        }
        p.subtitle {
            font-size: 1.1em;
            color: #222; 
            font-weight: 600;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }
        
        .input-nome {
            padding: 12px 20px;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            border: 2px solid #ccc;
            border-radius: 25px;
            width: 80%;
            max-width: 300px;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.3s;
            background: rgba(255, 255, 255, 0.9);
        }
        .input-nome:focus {
            border-color: #81C784; /* Verde claro no foco */
        }
        .msg-agradecimento {
            background-color: rgba(212, 237, 218, 0.9);
            color: #155724;
            padding: 15px;
            border-radius: 15px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none; 
        }

        .btn { 
            padding: 15px 30px; 
            font-size: 18px; 
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            border: none; 
            border-radius: 30px; 
            cursor: pointer; 
            margin: 10px; 
            color: white; 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
        }
        .btn:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }
        
        /* Botão da página inicial com degradê Verde Claro e Lilás */
        .btn-entrar {
            background: linear-gradient(135deg, #A8E6CF 0%, #D4B2D8 100%);
            color: #333;
            font-size: 22px;
            padding: 15px 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-top: 20px;
        }
        .btn-entrar:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        /* --- BOTÃO MENINO: VERDE CLARO --- */
        .btn-boy { 
            background-color: #A8E6CF; /* Verde claro pastel */
            color: #2D5A3F; /* Texto verde escuro para contraste */
            box-shadow: 0 4px 15px rgba(168, 230, 207, 0.5);
        }
        .btn-boy:hover:not(:disabled) { 
            background-color: #88DBB3; 
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(168, 230, 207, 0.7);
        }
        
        /* --- BOTÃO MENINA: LILÁS --- */
        .btn-girl { 
            background-color: #D4B2D8; /* Lilás pastel */
            color: #5A2D5C; /* Texto roxo/lilás escuro para contraste */
            box-shadow: 0 4px 15px rgba(212, 178, 216, 0.5);
        }
        .btn-girl:hover:not(:disabled) { 
            background-color: #C39CC7; 
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(212, 178, 216, 0.7);
        }

        .results { 
            margin-top: 40px; 
            font-size: 18px; 
            color: #222;
            font-weight: 600;
        }
        .placar-title {
            font-weight: 600;
            font-size: 1.3em;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }
        .bar-container { 
            display: flex; 
            height: 35px; 
            border-radius: 20px; 
            overflow: hidden; 
            margin-top: 20px; 
            background: rgba(255, 255, 255, 0.7); 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        
        /* Barra de progresso com as novas cores */
        .bar-boy { 
            background-color: #A8E6CF; 
            width: 50%; 
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .bar-girl { 
            background-color: #D4B2D8; 
            width: 50%; 
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
        }

        .historico-votos {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.65); 
            padding: 20px;
            border-radius: 15px;
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .historico-votos h3 {
            margin-top: 0;
            font-family: 'Fredoka', sans-serif;
            text-align: center;
            color: #333;
        }
        .historico-votos ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .historico-votos li {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            font-size: 15px;
            color: #333;
        }
        .historico-votos li:last-child {
            border-bottom: none;
        }
        
        /* Cores aplicadas nos textos da lista de palpites */
        .cor-menino { color: #2D5A3F; font-weight: bold; }
        .cor-menina { color: #5A2D5C; font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="tela-inicial">
    <h2>Chá Revelação</h2>
    <h1>Priscila & Diego</h1>
    <p class="subtitle">Participe da nossa revelação!</p>
    
    <button class="btn btn-entrar" id="btn-entrar">Votar</button>
</div>

<div class="container" id="tela-votacao" style="display: none;">
    <h2>Quem será o novo integrante do grupo de louvor?</h2>
    <div class="music-icons"> 🎹 🎻 🎤 🥁</div>
    <br>

    <div id="area-votacao">
        <input type="text" id="nome-votante" class="input-nome" placeholder="Digite seu nome para votar" required>
        <br>
        <button class="btn btn-boy" id="btn-boy">É Menino! 🥁💚​</button>
        <button class="btn btn-girl" id="btn-girl">É Menina! 🎻💜</button>
    </div>

    <!-- Mensagem que aparece depois de votar -->
    <div id="msg-agradecimento" class="msg-agradecimento">
        🎉 Seu palpite foi registrado com sucesso! Obrigado!
    </div>

    <div class="results">
        <div class="placar-title">Placar Atual</div>
        <p>Meninos: <strong id="count-boy">0</strong> | Meninas: <strong id="count-girl">0</strong></p>
        
        <div class="bar-container">
            <div class="bar-boy" id="bar-boy"></div>
            <div class="bar-girl" id="bar-girl"></div>
        </div>
    </div>

    <div class="historico-votos">
        <h3>Lista de Palpites 📜</h3>
        <ul id="lista-nomes">
            <!-- Os nomes vão aparecer aqui -->
        </ul>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc, updateDoc, increment, getDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBRhIu1b6ltYiJD1EhWTS3F80g8E3Zchzc",
        authDomain: "cha-revelacao-2512c.firebaseapp.com",
        projectId: "cha-revelacao-2512c",
        storageBucket: "cha-revelacao-2512c.firebasestorage.app",
        messagingSenderId: "150965177259",
        appId: "1:150965177259:web:18c20e58586d4b2c0c60ee"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    const docRef = doc(db, "votacao", "placar_v4");

    async function inicializarBanco() {
        const snap = await getDoc(docRef);
        if (!snap.exists()) {
            await setDoc(docRef, { meninos: 0, meninas: 0, historico: [] });
        }
    }
    inicializarBanco();

    // TRAVA DE SEGURANÇA NA INICIALIZAÇÃO
    if (localStorage.getItem('ja_votou_cha_revelacao')) {
        document.getElementById('area-votacao').style.display = 'none';
        document.getElementById('msg-agradecimento').style.display = 'block';
        document.getElementById('btn-entrar').innerText = "Ver Placar";
    }

    // LÓGICA DE NAVEGAÇÃO ENTRE AS TELAS
    document.getElementById('btn-entrar').addEventListener('click', () => {
        document.getElementById('tela-inicial').style.display = 'none';
        document.getElementById('tela-votacao').style.display = 'block';
    });

    onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
            const dados = docSnap.data();
            atualizarDashboard(dados.meninos, dados.meninas, dados.historico || []);
        }
    });

    async function votar(genero) {
        const nomeInput = document.getElementById('nome-votante').value.trim();
        
        if (nomeInput === "") {
            alert("Por favor, digite seu nome antes de votar!");
            document.getElementById('nome-votante').focus();
            return;
        }

        document.getElementById('btn-boy').disabled = true;
        document.getElementById('btn-girl').disabled = true;

        // Confetes atualizados para tons de verde claro e lilás
        if (genero === 'meninos') {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#A8E6CF', '#88DBB3', '#ffffff'] });
        } else {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#D4B2D8', '#C39CC7', '#ffffff'] });
        }

        await updateDoc(docRef, {
            [genero]: increment(1),
            historico: arrayUnion({ nome: nomeInput, voto: genero })
        });

        localStorage.setItem('ja_votou_cha_revelacao', 'sim');
        document.getElementById('area-votacao').style.display = 'none';
        document.getElementById('msg-agradecimento').style.display = 'block';
    }

    document.getElementById('btn-boy').addEventListener('click', () => votar('meninos'));
    document.getElementById('btn-girl').addEventListener('click', () => votar('meninas'));

    function atualizarDashboard(votosBoy, votosGirl, historico) {
        document.getElementById('count-boy').innerText = votosBoy;
        document.getElementById('count-girl').innerText = votosGirl;

        let total = votosBoy + votosGirl;
        let pctBoy = total === 0 ? 50 : (votosBoy / total) * 100;
        let pctGirl = total === 0 ? 50 : (votosGirl / total) * 100;

        document.getElementById('bar-boy').style.width = pctBoy + '%';
        document.getElementById('bar-girl').style.width = pctGirl + '%';

        const listaUl = document.getElementById('lista-nomes');
        listaUl.innerHTML = ''; 
        
        historico.forEach(item => {
            const li = document.createElement('li');
            if (item.voto === 'meninos') {
                li.innerHTML = `💚​ <strong>${item.nome}</strong> acha que é <span class="cor-menino">Menino</span>!`;
            } else {
                li.innerHTML = `💜 <strong>${item.nome}</strong> acha que é <span class="cor-menina">Menina</span>!`;
            }
            listaUl.appendChild(li);
        });
    }
</script>

</body>
</html>
