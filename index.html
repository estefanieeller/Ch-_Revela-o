<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chá Revelação - Priscila & Diego</title>
    <!-- Fontes mais bonitas e divertidas -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <!-- Biblioteca de confetes -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            text-align: center; 
            /* Fundo em degradê suave azul e rosa */
            background: linear-gradient(135deg, #e3f2fd 0%, #fce4ec 100%); 
            padding: 40px 20px;
            min-height: 100vh;
            margin: 0;
        }
        .container { 
            max-width: 550px; 
            margin: auto; 
            background: white; 
            padding: 40px 30px; 
            border-radius: 20px; 
            box-shadow: 0px 10px 30px rgba(0,0,0,0.1); 
        }
        h1 { 
            font-family: 'Fredoka', sans-serif;
            color: #333; 
            font-size: 2.5em;
            margin-bottom: 5px;
        }
        h2 {
            font-family: 'Fredoka', sans-serif;
            color: #555;
            font-size: 1.4em;
            margin-top: 0;
        }
        .music-icons {
            font-size: 2em;
            margin: 15px 0;
            letter-spacing: 15px;
        }
        p.subtitle {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 30px;
        }
        .btn { 
            padding: 15px 30px; 
            font-size: 18px; 
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            border: none; 
            border-radius: 30px; 
            cursor: pointer; 
            margin: 10px; 
            color: white; 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
        }
        .btn:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }
        
        /* --- NOVO AZUL CLARINHO --- */
        .btn-boy { 
            background-color: #89CFF0; /* Azul bebê */
            color: #0a4b78; /* Texto mais escuro para contraste */
            box-shadow: 0 4px 15px rgba(137, 207, 240, 0.4);
        }
        .btn-boy:hover:not(:disabled) { 
            background-color: #6CB4EE; /* Azul levemente mais forte no hover */
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(137, 207, 240, 0.6);
        }
        
        /* --- NOVO ROSA CLARINHO --- */
        .btn-girl { 
            background-color: #FFB6C1; /* Rosa claro */
            color: #d81b60; /* Texto mais escuro para contraste */
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.5);
        }
        .btn-girl:hover:not(:disabled) { 
            background-color: #FF9EAE; /* Rosa levemente mais forte no hover */
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 182, 193, 0.7);
        }

        .results { 
            margin-top: 40px; 
            font-size: 18px; 
            color: #444;
        }
        .placar-title {
            font-weight: 600;
            font-size: 1.3em;
            margin-bottom: 10px;
        }
        .bar-container { 
            display: flex; 
            height: 35px; 
            border-radius: 20px; 
            overflow: hidden; 
            margin-top: 20px; 
            background: #eee; 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        
        /* Barras com as novas cores claras */
        .bar-boy { 
            background-color: #89CFF0; 
            width: 50%; 
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .bar-girl { 
            background-color: #FFB6C1; 
            width: 50%; 
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Priscila & Diego</h1>
    <h2>Quem será o novo integrante do grupo de louvor?</h2>
    <div class="music-icons">🎸 🎹 🎻 🎤 🥁</div>
    <p class="subtitle"></p>

    <button class="btn btn-boy" id="btn-boy">É Menino! 🥁💙</button>
    <button class="btn btn-girl" id="btn-girl">É Menina! 🎻💖</button>

    <div class="results">
        <div class="placar-title">Placar Atual</div>
        <p>Meninos: <strong id="count-boy">0</strong> | Meninas: <strong id="count-girl">0</strong></p>
        
        <div class="bar-container">
            <div class="bar-boy" id="bar-boy"></div>
            <div class="bar-girl" id="bar-girl"></div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc, updateDoc, increment, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBRhIu1b6ltYiJD1EhWTS3F80g8E3Zchzc",
        authDomain: "cha-revelacao-2512c.firebaseapp.com",
        projectId: "cha-revelacao-2512c",
        storageBucket: "cha-revelacao-2512c.firebasestorage.app",
        messagingSenderId: "150965177259",
        appId: "1:150965177259:web:18c20e58586d4b2c0c60ee"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    // Novo documento no banco para zerar novamente os testes do azul escuro
    const docRef = doc(db, "votacao", "placar__oficial_v3");

    async function inicializarBanco() {
        const snap = await getDoc(docRef);
        if (!snap.exists()) {
            await setDoc(docRef, { meninos: 0, meninas: 0 });
        }
    }
    inicializarBanco();

    onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
            const dados = docSnap.data();
            atualizarDashboard(dados.meninos, dados.meninas);
        }
    });

    async function votar(genero) {
        document.getElementById('btn-boy').disabled = true;
        document.getElementById('btn-girl').disabled = true;

        // Confetes também ajustados para os tons mais claros
        if (genero === 'meninos') {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#89CFF0', '#ADD8E6', '#ffffff'] });
        } else {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#FFB6C1', '#FFC0CB', '#ffffff'] });
        }

        await updateDoc(docRef, {
            [genero]: increment(1)
        });

        document.getElementById('btn-boy').disabled = false;
        document.getElementById('btn-girl').disabled = false;
    }

    document.getElementById('btn-boy').addEventListener('click', () => votar('meninos'));
    document.getElementById('btn-girl').addEventListener('click', () => votar('meninas'));

    function atualizarDashboard(votosBoy, votosGirl) {
        document.getElementById('count-boy').innerText = votosBoy;
        document.getElementById('count-girl').innerText = votosGirl;

        let total = votosBoy + votosGirl;
        let pctBoy = total === 0 ? 50 : (votosBoy / total) * 100;
        let pctGirl = total === 0 ? 50 : (votosGirl / total) * 100;

        document.getElementById('bar-boy').style.width = pctBoy + '%';
        document.getElementById('bar-girl').style.width = pctGirl + '%';
    }
</script>

</body>
</html>
